name: Mise à jour hebdomadaire des lieux accessibles

on:
  schedule:
    # Chaque dimanche à 07h00 UTC (03h00 heure de Montréal)
    - cron: '0 7 * * 0'
  workflow_dispatch: # Permet de lancer la mise à jour manuellement en 1 clic sur GitHub
  push:
    paths:
      - 'data/curated_places.json'
      - 'data/custom_places.csv'
      - 'scripts/update_places.py'

permissions:
  contents: write

jobs:
  update-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Télécharger et fusionner les lieux accessibles (Montréal, Rive-Sud, Rive-Nord)
        run: python3 scripts/update_places.py

      - name: Enregistrer data/places.json s'il y a des changements
        run: |
          git config user.name "AccèsGrandMTL Bot"
          git config user.email "actions@github.com"
          git add data/places.json
          if git diff --staged --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "chore: mise à jour automatique du répertoire ($(date +'%Y-%m-%d'))"
            git push
          fi
